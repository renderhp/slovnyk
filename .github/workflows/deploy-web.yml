name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  # Republish with fresh data after the monthly dictionary build.
  workflow_run:
    workflows: ["Build dictionaries"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: npm ci
      - run: npm test

      - name: Fetch the latest dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ../release
          gh release download --repo "${{ github.repository }}" --dir ../release \
            --pattern manifest.json --pattern '*.sqlite.xz'
          xz -d ../release/*.sqlite.xz

      - name: Pack dictionaries for the web
        run: python scripts/prepare-data.py --manifest ../release/manifest.json --sqlite-dir ../release --out public/data

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
